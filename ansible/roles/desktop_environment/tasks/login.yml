- name: Install display manager and greeter
  community.general.pacman:
    name:
      - dbus
      - accountsservice
      - greetd
      - greetd-regreet
    state: present
  become: true

- name: Generate greetd config from template
  ansible.builtin.template:
    src: greetd-config.toml.j2
    dest: "{{ greetd_config_path }}"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Generate greetd-hyprland config from template
  ansible.builtin.template:
    src: greetd-hyprland.lua.j2
    dest: "{{ greetd_hyprland_path }}"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Enable greetd service
  become: true
  ansible.builtin.systemd:
    name: greetd.service
    enabled: true
    state: started