- name: Install XDG Desktop Portal
  community.general.pacman:
    name:
      - xdg-desktop-portal-hyprland
      - xdg-desktop-portal-gtk
    state: present
  become: true

- name: Ensure xdg desktop portal config directory exists
  file: path={{ user_config_dir }}/xdg-desktop-portal
        state=directory
        owner={{ username }}
        group={{ username }}

- name: Use GTK file picker
  ansible.builtin.copy:
    dest: "{{ user_config_dir }}/xdg-desktop-portal/hyprland-portals.conf"
    content: |
      [preferred]
      default = hyprland;gtk
      org.freedesktop.impl.portal.FileChooser = kde
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0644'

- name: Install XDG user dirs package
  community.general.pacman:
    name:
      - xdg-user-dirs
    state: present
  become: true

- name: Setup XDG user dirs
  ansible.builtin.shell: xdg-user-dirs-update
  register: command_result
  failed_when: command_result.rc != 0