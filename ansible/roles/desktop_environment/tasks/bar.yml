- name: Install status bar
  community.general.pacman:
    name: 
      - waybar
    state: present
  become: true

- name: Copy reload-waybar.sh
  ansible.builtin.copy:
    src: reload-waybar.sh
    dest: /usr/local/bin
    owner: root
    group: root
    mode: "0754"
  become: true
  notify: Reload systemd

- name: Copy reload-waybar.service
  ansible.builtin.copy:
    src: reload-waybar.service
    dest: /etc/systemd/system/reload-waybar.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Generate reload-waybar.path from template
  ansible.builtin.template:
    src: reload-waybar.path.j2
    dest: /etc/systemd/system/reload-waybar.path
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Enable and start waybar config watcher
  ansible.builtin.systemd_service:
    name: reload-waybar.path
    daemon_reload: true
    enabled: true
    state: started
  become: true

