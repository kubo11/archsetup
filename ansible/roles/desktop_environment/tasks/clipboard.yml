- name: Install clipboard utilities
  community.general.pacman:
    name: 
      - wl-clipboard
      - cliphist
    state: present
  become: true

- name: Copy cliphist rofi custom mode
  ansible.builtin.copy:
    src: cliphist-rofi-img
    dest: "{{ cliphist_rofi_img_path }}"
    owner: root
    group: root
    mode: '0755'
  become: true

