- name: Ensure group "plugdev" exists
  ansible.builtin.group:
    name: plugdev
    state: present
  become: true

- name: Add user to "plugdev" group
  ansible.builtin.user:
    name: "{{ username }}"
    groups: plugdev
    append: true
  become: true

- name: Install mouse control software
  community.general.pacman:
    name: 
      - solaar
    state: present
  become: true

- name: Reload udev rules
  ansible.builtin.shell: udevadm control --reload-rules
  register: command_result
  failed_when: command_result.rc != 0
  become: true

- name: Install webcam control software
  community.general.pacman:
    name: 
     - v4l-utils
    state: present
  become: true