- name: Install compression only tools
  community.general.pacman:
    name:
      - bzip2
      - gzip
      - xz
      - zstd
    state: present
  become: true

- name: Install archiving only tools
  community.general.pacman:
    name:
     - tar
    state: present
  become: true

- name: Install archiving and compression tools
  community.general.pacman:
    name:
      - 7zip
      - zip
      - unzip
    state: present
  become: true