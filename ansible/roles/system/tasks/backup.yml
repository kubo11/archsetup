- name: Install backup utilities
  community.general.pacman:
    name:
      - snapper
    state: present
  become: true

- name: Create snapper configs  
  block:
    - name: Check if snapper config exists
      stat:
        path: /etc/snapper/{{ item.name }}
      register: config

    - name: Create snapper configs
      ansible.builtin.shell: |
        snapper -c {{ item.name }} create-config {{ item.mountpoint }}
      when: not config.stat.exists
      become: true
  loop:
    - { name: root, mountpoint: / }
    - { name: home, mountpoint: /home }
    - { name: var_log, mountpoint: /var/log }
    - { name: var_cache, mountpoint: /var/cache }

- name: Copy snp script
  ansible.builtin.copy:
    src: snp
    dest: /usr/bin/snp
    owner: root
    group: root
    mode: '0755'
  become: true

