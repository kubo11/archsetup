- name: Install backup utilities
  community.general.pacman:
    name:
      - snapper
    state: present
  become: true

- name: Create snapper configs  
  ansible.builtin.include_tasks: configure_snapper.yml
  loop:
    - { name: root, mountpoint: / }
    - { name: home, mountpoint: /home }
    - { name: var_log, mountpoint: /var/log }
    - { name: var_cache, mountpoint: /var/cache }

- name: Copy snp script
  ansible.builtin.copy:
    src: snp
    dest: /usr/bin/snp
    owner: root
    group: root
    mode: '0755'
  become: true

