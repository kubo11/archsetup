- name: Run pacman upgrade
  pacman: 
    update_cache: yes
    upgrade: yes
  become: true

- name: Configure pacman
  ansible.builtin.include_tasks:
    file: pacman.yml

- name: Copy install-aur.sh 
  ansible.builtin.copy:
    src: install-aur.sh
    dest: "/home/{{ username }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: '0755'

