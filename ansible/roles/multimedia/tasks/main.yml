- name: Install and setup pipewire
  ansible.builtin.include_tasks:
    file: pipewire.yml

- name: Install audio controlling utilities
  community.general.pacman:
    name:
      - playerctl
      - alsa-utils
    state: present
  become: true

- name: Unmute alsa
  ansible.builtin.shell: |
    amixer sset Master unmute

- name: Install image software
  community.general.pacman:
    name:
      - gimp
      - inkscape
      - imagemagick
      - imv
    state: present
  become: true

- name: Install tev
  kewlfft.aur.aur:
    name: tev
    use: yay
    state: present
  become: yes
  become_user: aur_builder

- name: Install spotify
  community.general.pacman:
    name:
      - spotify-launcher
    state: present
  become: true

- name: Install audio editors
  community.general.pacman:
    name:
     - audacity
    state: present
  become: true

- name: Install video software
  community.general.pacman:
    name:
      - ffmpeg
      - mpv
      - mpv-mpris
      - yt-dlp
      - handbrake
    state: present
  become: true

- name: Install makemkv
  kewlfft.aur.aur:
    name: makemkv
    use: yay
    state: present
  become: yes
  become_user: aur_builder

- name: Install book software
  community.general.pacman:
    name:
      - calibre
    state: present
  become: true

- name: Install pdf viewer
  community.general.pacman:
    name:
      - zathura
      - zathura-pdf-mupdf
    state: present
  become: true

- name: Install office suite
  community.general.pacman:
    name:
      - libreoffice-still
    state: present
  become: true
