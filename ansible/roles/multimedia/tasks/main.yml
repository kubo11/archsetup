- name: Install and setup pipewire
  ansible.builtin.include_tasks:
    file: pipewire.yml

- name: Install audio controlling utilities
  community.general.pacman:
    name:
      - playerctl
      - alsa-utils
    state: present
  become: true

- name: Unmute alsa
  ansible.builtin.shell: |
    amixer sset Master unmute

- name: Install image editors
  community.general.pacman:
    name:
      - gimp
      - inkscape
      - imagemagick
    state: present
  become: true

- name: Install audio editors
  community.general.pacman:
    name:
     - audacity
    state: present
  become: true

- name: Install video software
  community.general.pacman:
    name:
      - ffmpeg
      - mpv
      - yt-dlp
    state: present
  become: true