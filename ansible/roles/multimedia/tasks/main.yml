- name: Install and setup pipewire
  ansible.builtin.include_tasks:
    file: pipewire.yml

- name: Install audio controlling utilities
  community.general.pacman:
   name: 
    - playerctl
    - alsa-utils
   state: present

- name: Unmute alsa
  ansible.builtin.shell: |
    amixer sset Master unmute

- name: Install image editors
  community.general.pacman:
   name:
    - gimp
    - inkscape
   state: present

- name: Install image editors
  community.general.pacman:
   name:
    - gimp
    - inkscape
    - imagemagick
   state: present

- name: Install audio editors
  community.general.pacman:
   name:
    - audacity
   state: present

- name: Install video software
  community.general.pacman:
   name:
    - ffmpeg
    - mpv
    - yt-dlp
   state: present