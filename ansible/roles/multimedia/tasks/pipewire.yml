- name: Install Pipewire
  community.general.pacman:
    name:
      - pipewire
      - wireplumber
      - pipewire-pulse
    state: present
  become: true

- name: Install audio config apps
  community.general.pacman:
    name: 
      - pavucontrol
      - qpwgraph
    state: present
  become: true

- name: Ensure group "audio" exists
  ansible.builtin.group:
    name: audio
    state: present
  become: true

- name: Add user to "audio" group
  ansible.builtin.user:
    name: "{{ username }}"
    groups: audio
    append: true
  become: true